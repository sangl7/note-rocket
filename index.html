<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui}img{max-width:100%}[hidden]{display:none!important}</style></head><body>
<meta name="claude:viewport-fit-sides" content="cover">
<title>Note Rocket</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jua&family=Gowun+Dodum&family=Noto+Music&display=swap">
<style>
/* Layout: one-screen game. A night-sky stage; the notation sits on a cream
   "sheet music" card so it reads black-on-paper like a real score; an
   eight-key piano octave is docked at the bottom as the answer pad. */
:root{
  color-scheme:dark;
  --sky-0:#12103a; --sky-1:#2b1d6e; --sky-2:#4a2a8a;
  --paper:#fff6e0; --ink:#1c1840;
  --sun:#ffc83d; --sun-deep:#c98a12; --coral:#ff6f61; --mint:#35d6a8; --mint-deep:#0f9d77; --aqua:#58c7f5; --lilac:#c3b4ff;
  --text:#f6f1ff; --text-dim:#b9aee6; --glass:rgba(255,255,255,.08); --glass-line:rgba(255,255,255,.17); --panel:#241c5c;
  --font-display:"Jua","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  --font-body:"Gowun Dodum","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--sky-0);color:var(--text);font-family:var(--font-body);font-size:16px;line-height:1.45;overflow:hidden;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;touch-action:manipulation;padding:0}
button:focus-visible{outline:3px solid var(--aqua);outline-offset:3px}
h1,h2,h3,p{margin:0}
h1,h2,h3{font-family:var(--font-display);font-weight:400;text-wrap:balance}

#sky{position:fixed;inset:0;z-index:0;overflow:hidden;background:
  radial-gradient(120% 80% at 85% 0%,var(--sky-2) 0%,transparent 55%),
  radial-gradient(90% 60% at 0% 100%,#3a1c63 0%,transparent 60%),
  linear-gradient(180deg,var(--sky-0),var(--sky-1))}
#sky i{position:absolute;border-radius:50%;background:#fff;opacity:.7;animation:twinkle 3.4s ease-in-out infinite}
@keyframes twinkle{50%{opacity:.12;transform:scale(.6)}}

#app{position:relative;z-index:1;height:100%;max-width:760px;margin:0 auto;display:flex;flex-direction:column;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.screen{flex:1;min-height:0;display:flex;flex-direction:column;gap:12px;padding-block:14px}
#home{overflow-y:auto;scrollbar-width:none;gap:14px}
#home::-webkit-scrollbar{display:none}

.btn{font-family:var(--font-display);font-size:22px;padding:12px 28px;border-radius:999px;background:var(--glass);border:2px solid var(--glass-line);color:var(--text);min-height:56px}
.btn.primary{background:var(--sun);color:var(--ink);border-color:transparent;box-shadow:0 6px 0 var(--sun-deep)}
.btn.primary:active{transform:translateY(4px);box-shadow:0 2px 0 var(--sun-deep)}
.btn.small{font-size:17px;min-height:44px;padding:8px 18px}
.btn.danger{border-color:var(--coral);color:#ffc2bb}
.icon-btn{width:48px;height:48px;border-radius:50%;background:var(--glass);border:1.5px solid var(--glass-line);display:grid;place-items:center;flex:none}
.icon-btn svg{width:24px;height:24px;fill:none;stroke:var(--text);stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}

/* ---------- home ---------- */
.top{display:flex;align-items:center;justify-content:space-between;gap:12px}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.logo{width:58px;height:58px;flex:none;transform:rotate(38deg);animation:hover 3s ease-in-out infinite}
@keyframes hover{50%{transform:rotate(38deg) translateY(-5px)}}
h1{font-size:34px;line-height:1.05}
.brand p{color:var(--text-dim);font-size:15px}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{display:inline-flex;align-items:center;gap:6px;font-family:var(--font-display);font-size:18px;padding:5px 14px;border-radius:99px;background:var(--glass);border:1.5px solid var(--glass-line);font-variant-numeric:tabular-nums}
.chip svg{width:20px;height:20px}
.chip .s{fill:var(--sun)} .chip .f{fill:var(--coral)}
.world{border-radius:26px;padding:16px;background:var(--glass);border:1.5px solid var(--glass-line);display:flex;flex-direction:column;gap:14px}
.world-head{display:flex;align-items:center;gap:12px}
.cl{height:54px;min-width:46px;padding:6px 10px;border-radius:14px;background:var(--paper);color:var(--ink);display:flex;align-items:center;justify-content:center;gap:6px;flex:none}
.cl svg{height:40px;width:auto;display:block}
.cl svg.bass{height:24px}
h2{font-size:23px;line-height:1.15}
.world-head p{color:var(--text-dim);font-size:14px}
.nodes{display:grid;grid-template-columns:repeat(3,1fr);gap:16px 8px}
@media (min-width:600px){.nodes{grid-template-columns:repeat(6,1fr)}}
.node{display:flex;flex-direction:column;align-items:center;gap:5px;padding:4px 0;min-width:0;border-radius:16px}
.planet{width:64px;height:64px;border-radius:50%;display:grid;place-items:center;position:relative;font-family:var(--font-display);font-size:27px;color:var(--ink);
  background:radial-gradient(circle at 32% 28%,hsl(var(--h) 95% 82%),hsl(var(--h) 84% 60%) 58%,hsl(calc(var(--h) + 18) 70% 38%));box-shadow:0 5px 0 rgba(0,0,0,.3)}
.node.boss .planet::after{content:"";position:absolute;inset:23px -13px;border:3px solid rgba(255,255,255,.8);border-top-color:transparent;border-radius:50%;transform:rotate(-16deg);pointer-events:none}
.node.locked .planet{background:radial-gradient(circle at 32% 28%,#8f89ad,#5a557e 60%,#37325c);color:#fff}
.node.locked .planet svg{width:24px;height:24px;fill:#e8e4ff}
.node.next .planet{animation:bob 1.6s ease-in-out infinite;box-shadow:0 5px 0 rgba(0,0,0,.3),0 0 0 4px rgba(255,200,61,.6)}
@keyframes bob{50%{transform:translateY(-6px)}}
.badge{position:absolute;top:-6px;right:-8px;width:26px;height:26px;border-radius:50%;background:var(--ink);display:grid;place-items:center;border:2px solid var(--aqua)}
.badge svg{width:14px;height:14px;fill:var(--aqua)}
.nstars{display:flex;gap:1px}
.nstars svg{width:15px;height:15px;fill:rgba(255,255,255,.22)}
.nstars svg.on{fill:var(--sun)}
.nlab{font-size:13px;color:var(--text-dim);text-align:center;line-height:1.2;white-space:nowrap}
.train{display:flex;align-items:center;gap:14px;text-align:left;padding:14px 16px;border-radius:22px;background:linear-gradient(100deg,rgba(88,199,245,.26),rgba(195,180,255,.2));border:1.5px solid var(--glass-line)}
.train svg{width:40px;height:40px;fill:var(--aqua);color:var(--aqua);flex:none}
.train.on{background:linear-gradient(100deg,rgba(53,214,168,.3),rgba(88,199,245,.18));border-color:var(--mint)}
.train.on svg{fill:var(--mint);color:var(--mint)}
.train b{display:block;font-family:var(--font-display);font-weight:400;font-size:21px}
.train span{color:var(--text-dim);font-size:14px}
.foot{color:var(--text-dim);font-size:13px;text-align:center;padding-bottom:8px}

/* ---------- play ---------- */
.bar{display:flex;align-items:center;gap:10px;flex:none}
.track{flex:1;height:14px;border-radius:99px;background:rgba(255,255,255,.14);position:relative;margin:0 22px 0 14px}
.trail{position:absolute;left:0;top:0;bottom:0;border-radius:99px;background:linear-gradient(90deg,var(--coral),var(--sun));width:0;transition:width .5s cubic-bezier(.3,1.4,.5,1)}
.rk{position:absolute;top:50%;left:0;width:36px;height:36px;margin:-18px 0 0 -18px;transform:rotate(90deg);transition:left .5s cubic-bezier(.3,1.4,.5,1)}
.goal{position:absolute;right:-20px;top:50%;width:26px;height:26px;margin-top:-13px;border-radius:50%;background:radial-gradient(circle at 30% 30%,#ffeeb5,var(--sun) 60%,#d98a1c)}
.count,.clock{font-family:var(--font-display);font-size:18px;font-variant-numeric:tabular-nums;text-align:right;flex:none}
.clock{min-width:42px;color:var(--text-dim)}
.card{flex:1;min-height:0;background:var(--paper);border-radius:28px;position:relative;box-shadow:0 10px 0 rgba(0,0,0,.26),inset 0 0 0 3px #fff}
.staff{position:absolute;left:14px;top:8px;width:calc(100% - 28px);height:calc(100% - 16px);display:block}
.staff line{stroke:var(--ink);stroke-width:1.1}
.staff .clef{fill:var(--ink)}
.note{color:var(--ink);fill:currentColor}
.note .stem{stroke:currentColor;stroke-width:1.3;stroke-linecap:round}
.note .ledger{stroke:var(--ink);stroke-width:1.3}
.note.ok{color:var(--mint-deep)}
.note.m0{color:#bcb5d2}.note.m1{color:var(--mint-deep)}.note.m2{color:#e09a00}.note.m3{color:#e2483a}
.note.enter{animation:noteIn .38s cubic-bezier(.2,.9,.3,1.15) both}
@keyframes noteIn{from{transform:translateX(70px);opacity:0}}
.nlabel{font-family:var(--font-display);fill:var(--mint-deep);font-size:13px}
.pill{position:absolute;left:50%;bottom:10px;transform:translateX(-50%);background:var(--ink);color:var(--text);font-size:14px;padding:5px 14px;border-radius:99px;white-space:nowrap;display:flex;gap:8px;align-items:center}
.pill i{width:9px;height:9px;border-radius:50%;background:var(--coral);animation:twinkle 1.2s infinite}
.say{height:40px;flex:none;display:flex;align-items:center;justify-content:center;gap:10px;font-family:var(--font-display);font-size:26px;text-align:center}
.say.ok{color:var(--mint)} .say.no{color:#ffb7ae}
.combo{font-size:16px;background:var(--coral);color:#fff;padding:3px 11px;border-radius:99px}

.keys{position:relative;display:grid;grid-template-columns:repeat(8,1fr);gap:5px;height:clamp(118px,25vh,200px);flex:none;user-select:none;-webkit-user-select:none}
.key{position:relative;border-radius:6px 6px 14px 14px;background:linear-gradient(180deg,#fffdf6,#f3e9d2);box-shadow:0 6px 0 #b3a685,inset 0 -10px 14px rgba(0,0,0,.05);color:var(--ink);
  display:flex;align-items:flex-end;justify-content:center;padding-bottom:12px;margin-bottom:6px;font-family:var(--font-display);font-size:clamp(17px,4.6vw,27px);line-height:1.05;transition:transform .06s}
.key:active,.key.down{transform:translateY(4px);box-shadow:0 2px 0 #b3a685}
.key.ok{background:linear-gradient(180deg,#b6f5e1,var(--mint))}
.key.no{background:linear-gradient(180deg,#ffd9d4,#ffa79c);animation:shake .32s}
.key.hint{background:linear-gradient(180deg,#fff3c4,var(--sun));animation:pulse .9s ease-in-out infinite}
.key small{display:block;font-size:.62em;opacity:.6}
.kname{pointer-events:none;text-align:center}
.keys.nolabel .kname{visibility:hidden}
.keys.nolabel .key.hint .kname{visibility:visible}
.bk{position:absolute;top:0;width:7.4%;height:56%;background:linear-gradient(180deg,#322c5e,#15123a);border-radius:0 0 7px 7px;transform:translateX(-50%);box-shadow:0 4px 0 #0a081f;z-index:2}
@keyframes shake{25%{transform:translateX(-5px)}50%{transform:translateX(5px)}75%{transform:translateX(-3px)}}
@keyframes pulse{50%{transform:translateY(-5px)}}

/* ---------- teach ---------- */
.teach-top{display:flex;align-items:center;gap:12px;flex:none}
.teach-top h2{flex:1}
.dots{display:flex;gap:6px}
.dots i{width:10px;height:10px;border-radius:50%;background:rgba(255,255,255,.22)}
.dots i.on{background:var(--sun)}
.tinfo{flex:none;text-align:center;display:flex;flex-direction:column;gap:2px;align-items:center}
.bigname{font-family:var(--font-display);font-size:44px;line-height:1.05;color:var(--sun)}
.tip{font-size:17px;max-width:30em}
.teach-actions{display:flex;gap:10px;justify-content:center;flex:none;padding-bottom:4px}
#teach .keys{height:clamp(84px,15vh,120px)}

/* ---------- result ---------- */
#result{align-items:center;justify-content:center;text-align:center;gap:18px;overflow-y:auto}
#result h2{font-size:38px}
.rstars{display:flex;gap:8px;align-items:flex-end}
.rstars svg{width:78px;height:78px;fill:rgba(255,255,255,.14)}
.rstars svg:nth-child(2){width:100px;height:100px}
.rstars svg.on{fill:var(--sun);filter:drop-shadow(0 5px 0 #a86c0a);animation:pop .5s cubic-bezier(.2,1.6,.4,1) both;animation-delay:calc(var(--i)*.3s + .25s)}
@keyframes pop{from{transform:scale(0) rotate(-40deg);opacity:0}}
.stats{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.stat{min-width:96px;padding:10px 14px;border-radius:18px;background:var(--glass);border:1.5px solid var(--glass-line)}
.stat b{display:block;font-family:var(--font-display);font-weight:400;font-size:24px;font-variant-numeric:tabular-nums}
.stat span{font-size:13px;color:var(--text-dim)}
.boltline{display:inline-flex;align-items:center;gap:8px;font-family:var(--font-display);font-size:20px;color:var(--aqua)}
.boltline svg{width:24px;height:24px;fill:var(--aqua)}
.rmsg{font-size:17px;color:var(--text-dim);max-width:24em}
.ractions{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}

/* ---------- overlays ---------- */
.overlay{position:fixed;inset:0;z-index:20;background:rgba(10,8,34,.74);display:grid;place-items:center;
  padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.panel{width:min(520px,100%);max-height:100%;overflow-y:auto;background:var(--panel);border:1.5px solid var(--glass-line);border-radius:26px;padding:20px;display:flex;flex-direction:column;gap:14px}
.panel-head{display:flex;align-items:center;justify-content:space-between;gap:12px}
.row{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:44px}
.row > span{min-width:0}
.seg{display:inline-flex;background:rgba(0,0,0,.28);border-radius:99px;padding:3px;flex:none}
.seg button{padding:8px 13px;border-radius:99px;font-family:var(--font-display);font-size:16px;color:var(--text-dim)}
.seg button[aria-pressed="true"]{background:var(--sun);color:var(--ink)}
.switch{width:56px;height:32px;border-radius:99px;background:rgba(255,255,255,.2);position:relative;flex:none}
.switch::after{content:"";position:absolute;top:3px;left:3px;width:26px;height:26px;border-radius:50%;background:#fff;transition:transform .15s}
.switch[aria-checked="true"]{background:var(--mint)}
.switch[aria-checked="true"]::after{transform:translateX(24px)}
.hr{height:1.5px;background:var(--glass-line);flex:none}
.report{background:var(--paper);border-radius:18px;padding:6px 8px;display:flex;flex-direction:column;gap:2px}
.report svg{position:static;width:100%;height:auto}
.help{font-size:14px;color:var(--text-dim)}
.weaklist{font-size:15px}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:13px;color:var(--text-dim)}
.legend i{display:inline-block;width:11px;height:11px;border-radius:50%;margin-right:5px;vertical-align:-1px}
.pickgrid{display:grid;gap:10px}
.pickgrid .btn{width:100%}
.linkbtn{color:var(--text-dim);text-decoration:underline;font-size:15px;align-self:center;padding:8px}

#fx{position:fixed;inset:0;pointer-events:none;z-index:30;overflow:hidden}
.spark{position:absolute;width:20px;height:20px;margin:-10px 0 0 -10px;fill:var(--sun);animation:spark .75s ease-out forwards}
@keyframes spark{to{transform:translate(var(--dx),var(--dy)) scale(.2) rotate(200deg);opacity:0}}
.conf{position:absolute;top:-24px;width:10px;height:16px;border-radius:3px;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(115vh) rotate(720deg)}}
#toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:40;background:var(--ink);border:1.5px solid var(--glass-line);color:var(--text);padding:10px 18px;border-radius:99px;font-size:15px;max-width:calc(100% - 32px);text-align:center}

@media (max-height:520px){
  .screen{gap:8px;padding-block:8px}
  .say{height:30px;font-size:21px}
  .keys{height:104px}
  .bigname{font-size:30px}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}
}
</style>

<div id="sky" aria-hidden="true"></div>
<div id="app">
  <section id="home" class="screen"></section>
  <section id="teach" class="screen" hidden></section>
  <section id="play" class="screen" hidden>
    <div class="bar">
      <button class="icon-btn" id="quit" type="button"></button>
      <div class="track"><span class="trail" id="trail"></span><span class="rk" id="rk"></span><span class="goal"></span></div>
      <span class="count" id="count"></span>
      <span class="clock" id="clock"></span>
    </div>
    <div class="card" id="stage"><div id="staffbox"></div><div class="pill" id="pill" hidden></div></div>
    <div class="say" id="say" aria-live="polite"></div>
    <div class="keys" id="keys"></div>
  </section>
  <section id="result" class="screen" hidden></section>
</div>
<div id="sheet" class="overlay" hidden></div>
<div id="pick" class="overlay" hidden></div>
<div id="fx" aria-hidden="true"></div>
<div id="toast" role="status" hidden></div>

<script>

function renderSheet(){
  const seg = (id, opts, cur) => `<span class="seg" id="${id}">${opts.map(([v, l]) => `<button type="button" data-v="${v}" aria-pressed="${v === cur}">${l}</button>`).join('')}</span>`;
  const sw = (id, on) => `<button class="switch" type="button" role="switch" id="${id}" aria-checked="${!!on}" aria-labelledby="${id}-l"></button>`;
  const row = (id, label, on, sub) => `<div class="row"><span id="${id}-l">${label}${sub ? `<br><span class="help">${sub}</span>` : ''}</span>${sw(id, on)}</div>`;
  const tr = T('C4','D4','E4','F4','G4','A4','B4','C5','D5','E5','F5','G5','A5','B5','C6'), bs = B('C2','D2','E2','F2','G2','A2','B2','C3','D3','E3','F3','G3','A3','B3','C4');
  const rep = (m, ids) => staffSVG(m, ids.map((id, i) => ({ id, x:48 + i * 14.5, cls:'m' + mastery(id) })), { w:268, stemless:true, pad:3.2, aria:t('report') });
  const weakIds = [...tr, ...bs].filter(id => mastery(id) >= 2).sort((a, b) => weak(b) - weak(a)).slice(0, 8);
  const weakTxt = weakIds.length ? t('weakIs') + weakIds.map(id => (id[0] === 't' ? t('treble') : t('bass')) + ' ' + shortNm(parse(id).L)).join(', ') : t('weakNone');
  $('#sheet').innerHTML = `<div class="panel" role="dialog" aria-modal="true" aria-label="${t('parent')}">
    <div class="panel-head"><h2>${t('parent')}</h2><button class="icon-btn" id="sclose" type="button" aria-label="${t('close')}">${ICON.x}</button></div>
    <div class="row"><span>${t('names')}</span>${seg('seg-names', [['do', SOLFA[S.lang].slice(0, 3).join('')], ['cde', 'CDE'], ['both', t('both')]], mode())}</div>
    <div class="row"><span>${t('lang')}</span>${seg('seg-lang', [['ko', '한국어'], ['en', 'English']], S.lang)}</div>
    ${row('sw-labels', t('labels'), S.labels)}${row('sw-timer', t('timer'), S.timer)}${row('sw-sound', t('sound'), S.sound)}
    ${micPossible ? row('sw-mic', t('mic'), wantMic, t('micS')) : ''}${row('sw-unlock', t('unlockAll'), S.unlockAll)}
    <div class="hr"></div><h3>${t('report')}</h3>
    <div class="report">${rep('t', tr)}${rep('b', bs)}</div>
    <div class="legend">${[1, 2, 3, 0].map(k => `<span><i style="background:${['#bcb5d2', '#0f9d77', '#e09a00', '#e2483a'][k]}"></i>${t('m' + k)}</span>`).join('')}</div>
    <p class="weaklist">${weakTxt}</p>
    <div class="hr"></div>
    <div id="resetbox"><button class="btn small danger" id="reset" type="button">${t('reset')}</button></div>
  </div>`;
}
function openPick(){
  $('#pick').hidden = false;
  $('#pick').innerHTML = `<div class="panel" role="dialog" aria-modal="true" aria-label="${t('pick')}"><span class="logo" style="align-self:center">${ICON.rocket}</span>
    <h2 style="text-align:center">${t('pick')}</h2>
    <div class="pickgrid"><button class="btn primary" type="button" data-pick="do">${SOLFA[S.lang].slice(0, 3).join(' ')}</button><button class="btn primary" type="button" data-pick="cde">C D E</button><button class="btn" type="button" data-pick="both">${t('both')}</button></div>
    <p class="help" style="text-align:center">${t('pickS')}</p>
    <button class="linkbtn" type="button" id="picklang">${S.lang === 'ko' ? 'English' : '한국어'}</button></div>`;
}
const setting = () => { S.ts = Date.now(); persist(); redraw(); };

/* ---------- events ---------- */
$('#home').addEventListener('click', e => {
  const n = e.target.closest('.node'); if (n) return openLevel(LV[n.dataset.lv]);
  if (e.target.closest('#gear')) { $('#sheet').hidden = false; renderSheet(); }
  if (e.target.closest('#train')) startTraining();
  if (e.target.closest('#mictoggle')) setMic(!wantMic).then(redraw);
});
$('#teach').addEventListener('click', e => {
  if (e.target.closest('#tquit')) return goHome();
  if (e.target.closest('#tnext')) { if (TC.i < TC.cards.length - 1) { TC.i++; drawTeach(); } else { const lv = TC.lv; TC = null; startRound(lv); } return; }
  const k = e.target.closest('.key.hint'); if (k) tone(+$('#tkeys').dataset.midi);
});
$('#keys').addEventListener('pointerdown', e => { const k = e.target.closest('.key'); if (k) { e.preventDefault(); AC(); answer(+k.dataset.l, k); } });
$('#keys').addEventListener('keydown', e => { const k = e.target.closest('.key'); if (k && (e.key === 'Enter' || e.key === ' ')) { e.preventDefault(); answer(+k.dataset.l, k); } });
document.addEventListener('keydown', e => {
  if (SCREEN !== 'play' || e.metaKey || e.ctrlKey || e.altKey) return;
  const L = LETTERS.indexOf(e.key.toUpperCase()); if (L >= 0) answer(L, $('#keys').querySelector(`.key[data-k="${L}"]`));
});
$('#quit').addEventListener('click', goHome);
$('#result').addEventListener('click', e => {
  if (e.target.closest('#rmap')) return goHome();
  if (e.target.closest('#ragain')) return LAST.lv.train ? startTraining() : startRound(LAST.lv);
  if (e.target.closest('#rnext')) { const nx = nextOf(LAST.lv); if (nx) openLevel(nx); }
});
$('#sheet').addEventListener('click', async e => {
  if (e.target === $('#sheet') || e.target.closest('#sclose')) { $('#sheet').hidden = true; return; }
  const sb = e.target.closest('.seg button');
  if (sb) { const id = sb.parentNode.id; if (id === 'seg-names') S.nameMode = sb.dataset.v; if (id === 'seg-lang') S.lang = sb.dataset.v; return setting(); }
  const s = e.target.closest('.switch');
  if (s) {
    const on = s.getAttribute('aria-checked') !== 'true';
    if (s.id === 'sw-mic') { await setMic(on); return redraw(); }
    S[{ 'sw-labels':'labels', 'sw-timer':'timer', 'sw-sound':'sound', 'sw-unlock':'unlockAll' }[s.id]] = on; return setting();
  }
  if (e.target.closest('#reset')) $('#resetbox').innerHTML = `<p>${t('resetAsk')}</p><div class="row" style="justify-content:flex-start"><button class="btn small danger" id="resetyes" type="button">${t('resetYes')}</button><button class="btn small" id="resetno" type="button">${t('cancel')}</button></div>`;
  else if (e.target.closest('#resetno')) renderSheet();
  else if (e.target.closest('#resetyes')) { const keep = {}; for (const k of SETTINGS) keep[k] = S[k]; S = norm(keep); S.ts = Date.now(); persist(); redraw(); toast(t('resetDone')); }
});
$('#pick').addEventListener('click', e => {
  const b = e.target.closest('[data-pick]');
  if (b) { S.nameMode = b.dataset.pick; $('#pick').hidden = true; AC(); return setting(); }
  if (e.target.closest('#picklang')) { S.lang = S.lang === 'ko' ? 'en' : 'ko'; redraw(); }
});
document.addEventListener('visibilitychange', () => { if (document.hidden && Mic.on) micStop(); else if (!document.hidden && G && wantMic) micStart().then(() => pill()); });

/* ---------- boot ---------- */
(() => { const sky = $('#sky'); let h = ''; for (let i = 0; i < 70; i++) { const s = 1 + Math.random() * 2.4; h += `<i style="left:${Math.random() * 100}%;top:${Math.random() * 100}%;width:${s}px;height:${s}px;animation-delay:${-Math.random() * 3.4}s"></i>`; } sky.innerHTML = h; })();
redraw();
if (!S.nameMode) openPick();
initClefs();
initCloud();
window.__noteRocket = { detectPitch, get current(){ return G && !G.locked ? G.cur : null; } };
})();
</script>

</body></html>
